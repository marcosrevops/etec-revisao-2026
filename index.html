<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quiz Escriturário — Piratininga-SP 2026</title>
<meta name="description" content="Quiz interativo para o Concurso de Escriturário da Prefeitura de Piratininga-SP 2026. 50 questões com feedback em tempo real.">
<meta name="theme-color" content="#0f0f1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f1a;
  --bg-card: #1a1a2e;
  --bg-card-hover: #222240;
  --primary: #6366f1;
  --primary-light: #a5b4fc;
  --purple: #8b5cf6;
  --correct: #10b981;
  --correct-bg: rgba(16, 185, 129, 0.12);
  --wrong: #ef4444;
  --wrong-bg: rgba(239, 68, 68, 0.12);
  --amber: #f59e0b;
  --amber-bg: rgba(245, 158, 11, 0.08);
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: rgba(99, 102, 241, 0.2);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 16px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ====== NAV ====== */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 15, 26, 0.95);
  backdrop-filter: blur(10px);
  padding: 12px 16px;
  margin: -20px -16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary-light);
}

.nav-back {
  background: none;
  border: none;
  color: var(--primary-light);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  transition: background 0.2s;
}

.nav-back:hover { background: rgba(99,102,241,0.1); }

.nav-progress {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

/* ====== SCREENS ====== */
.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* ====== LANDING ====== */
.landing-hero {
  text-align: center;
  padding: 40px 0 30px;
}

.landing-greeting {
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #fff, #c4b5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.landing-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 32px;
}

.progress-ring-container {
  position: relative;
  width: 160px;
  height: 160px;
  margin: 0 auto 24px;
}

.progress-ring {
  transform: rotate(-90deg);
}

.progress-ring-bg {
  fill: none;
  stroke: rgba(99,102,241,0.15);
  stroke-width: 10;
}

.progress-ring-fill {
  fill: none;
  stroke: url(#gradient);
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s ease;
}

.progress-ring-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.progress-ring-pct {
  font-size: 32px;
  font-weight: 900;
  color: var(--text);
}

.progress-ring-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.landing-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 10px;
  text-align: center;
}

.stat-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
}

.stat-label {
  font-size: 10px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.btn {
  display: block;
  width: 100%;
  padding: 16px 24px;
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
  box-shadow: 0 4px 16px rgba(99,102,241,0.3);
}

.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  background: var(--bg-card);
  color: var(--primary-light);
  border: 1px solid var(--border);
  margin-top: 12px;
}

.btn-secondary:hover { background: var(--bg-card-hover); }

.btn-danger {
  background: rgba(239, 68, 68, 0.1);
  color: var(--wrong);
  border: 1px solid rgba(239, 68, 68, 0.3);
  margin-top: 12px;
}

/* ====== BLOCK SELECTION ====== */
.blocks-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}

.block-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 16px;
}

.block-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.block-card:active { transform: translateY(0); }

.block-card.completed { border-color: var(--correct); }
.block-card.in-progress { border-color: var(--amber); }

.block-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: rgba(99,102,241,0.15);
}

.block-info { flex: 1; min-width: 0; }

.block-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.block-meta {
  font-size: 12px;
  color: var(--text-secondary);
}

.block-progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(99,102,241,0.15);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}

.block-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--purple));
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ====== QUIZ ====== */
.quiz-header {
  text-align: center;
  margin-bottom: 24px;
}

.quiz-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 16px;
}

.quiz-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(99,102,241,0.2);
  transition: all 0.3s;
}

.quiz-dot.answered { background: var(--primary); }
.quiz-dot.current { background: var(--primary-light); transform: scale(1.3); }
.quiz-dot.correct { background: var(--correct); }
.quiz-dot.wrong { background: var(--wrong); }

.quiz-counter {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.quiz-topic {
  display: inline-block;
  background: rgba(99,102,241,0.15);
  color: var(--primary-light);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.quiz-question {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 24px;
  padding: 20px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.option-btn {
  width: 100%;
  min-height: 56px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.option-btn:hover:not(.disabled) {
  background: var(--bg-card-hover);
  border-color: var(--primary);
}

.option-btn:active:not(.disabled) { transform: scale(0.98); }

.option-btn .option-key {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(99,102,241,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--primary-light);
  flex-shrink: 0;
  transition: all 0.3s;
}

.option-btn .option-text { flex: 1; }

.option-btn.disabled { cursor: default; pointer-events: none; }

.option-btn.selected-correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  animation: correctPulse 0.4s ease;
}

.option-btn.selected-correct .option-key {
  background: var(--correct);
  color: #fff;
}

.option-btn.selected-wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  animation: wrongShake 0.4s ease;
}

.option-btn.selected-wrong .option-key {
  background: var(--wrong);
  color: #fff;
}

.option-btn.reveal-correct {
  border-color: var(--correct);
  background: var(--correct-bg);
}

.option-btn.reveal-correct .option-key {
  background: var(--correct);
  color: #fff;
}

/* ====== EXPLANATION ====== */
.explanation-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--amber);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  animation: slideUp 0.4s ease;
  display: none;
}

.explanation-panel.visible { display: block; }

.explanation-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.explanation-text {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 12px;
}

.study-suggestion {
  background: var(--amber-bg);
  border: 1px solid rgba(245,158,11,0.2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-top: 12px;
}

.study-suggestion-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.study-suggestion-text {
  font-size: 13px;
  color: #d4b896;
  line-height: 1.5;
}

.btn-next {
  margin-top: 8px;
}

/* ====== RESULTS ====== */
.results-score {
  text-align: center;
  padding: 30px 0;
}

.results-circle {
  width: 140px;
  height: 140px;
  margin: 0 auto 20px;
  position: relative;
}

.results-circle svg { transform: rotate(-90deg); }

.results-circle-bg {
  fill: none;
  stroke: rgba(99,102,241,0.15);
  stroke-width: 8;
}

.results-circle-fill {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s ease;
}

.results-number {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  font-weight: 900;
}

.results-label {
  font-size: 14px;
  color: var(--text-secondary);
}

.results-message {
  font-size: 18px;
  font-weight: 700;
  margin-top: 12px;
}

.results-list {
  margin: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.result-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.result-icon.correct { background: var(--correct); color: #fff; }
.result-icon.wrong { background: var(--wrong); color: #fff; }

.result-topic {
  font-size: 13px;
  color: var(--text-secondary);
  flex: 1;
}

.weak-topics {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--amber);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin: 20px 0;
}

.weak-topics-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 12px;
}

.weak-topic-item {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
}

.weak-topic-item:last-child { border-bottom: none; }

/* ====== DASHBOARD ====== */
.dashboard-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 20px;
  color: var(--text);
}

.dashboard-blocks {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
}

.dash-block {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.dash-block-name {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.dash-block-score {
  font-size: 14px;
  font-weight: 700;
}

/* ====== ANIMATIONS ====== */
@keyframes correctPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.015); }
  100% { transform: scale(1); }
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes slideUp {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.fade-in { animation: fadeIn 0.3s ease; }

/* ====== RESPONSIVE ====== */
@media (min-width: 481px) {
  .container { padding: 24px; }
  .landing-stats { gap: 16px; }
}

@media (max-width: 360px) {
  .quiz-question { font-size: 15px; padding: 16px; }
  .option-btn { min-height: 50px; padding: 12px 14px; font-size: 13px; }
  .landing-greeting { font-size: 24px; }
}
</style>
</head>
<body>

<div class="container" id="app">
  <!-- NAV -->
  <nav class="nav" id="nav">
    <button class="nav-back" id="navBack" onclick="goBack()">&#8592; Voltar</button>
    <span class="nav-title" id="navTitle">Quiz Escriturario</span>
    <span class="nav-progress" id="navProgress"></span>
  </nav>

  <!-- SCREEN: LANDING -->
  <div class="screen active" id="screenLanding">
    <div class="landing-hero">
      <h1 class="landing-greeting">Ola, Dandara!</h1>
      <p class="landing-subtitle">Concurso Escriturario — Piratininga-SP 2026</p>

      <div class="progress-ring-container">
        <svg class="progress-ring" width="160" height="160">
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <circle class="progress-ring-bg" cx="80" cy="80" r="65"/>
          <circle class="progress-ring-fill" id="progressRing" cx="80" cy="80" r="65"
            stroke-dasharray="408.4" stroke-dashoffset="408.4"/>
        </svg>
        <div class="progress-ring-text">
          <div class="progress-ring-pct" id="landingPct">0%</div>
          <div class="progress-ring-label">Completo</div>
        </div>
      </div>

      <div class="landing-stats">
        <div class="stat-card">
          <div class="stat-value" id="statAnswered">0</div>
          <div class="stat-label">Respondidas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statCorrect">0</div>
          <div class="stat-label">Acertos</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statAccuracy">--</div>
          <div class="stat-label">Precisao</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="navigate('#/blocks')">Escolher Bloco</button>
    <button class="btn btn-secondary" onclick="navigate('#/dashboard')">Ver Dashboard</button>
  </div>

  <!-- SCREEN: BLOCKS -->
  <div class="screen" id="screenBlocks">
    <div class="blocks-grid" id="blocksGrid"></div>
  </div>

  <!-- SCREEN: QUIZ -->
  <div class="screen" id="screenQuiz">
    <div class="quiz-header">
      <div class="quiz-dots" id="quizDots"></div>
      <div class="quiz-counter" id="quizCounter"></div>
      <div class="quiz-topic" id="quizTopic"></div>
    </div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="explanation-panel" id="explanationPanel">
      <div class="explanation-title">Explicacao</div>
      <div class="explanation-text" id="explanationText"></div>
      <div class="study-suggestion" id="studySuggestion">
        <div class="study-suggestion-title">O que estudar</div>
        <div class="study-suggestion-text" id="studySuggestionText"></div>
      </div>
    </div>
    <button class="btn btn-primary btn-next" id="btnNext" style="display:none" onclick="nextQuestion()">Proxima Questao</button>
  </div>

  <!-- SCREEN: RESULTS -->
  <div class="screen" id="screenResults">
    <div class="results-score">
      <div class="results-circle">
        <svg width="140" height="140">
          <circle class="results-circle-bg" cx="70" cy="70" r="56"/>
          <circle class="results-circle-fill" id="resultsCircle" cx="70" cy="70" r="56"
            stroke-dasharray="351.9" stroke-dashoffset="351.9"/>
        </svg>
        <div class="results-number" id="resultsNumber">0/10</div>
      </div>
      <div class="results-label">Acertos neste bloco</div>
      <div class="results-message" id="resultsMessage"></div>
    </div>
    <div class="results-list" id="resultsList"></div>
    <div class="weak-topics" id="weakTopics" style="display:none">
      <div class="weak-topics-title">Topicos para Revisar</div>
      <div id="weakTopicsList"></div>
    </div>
    <button class="btn btn-primary" onclick="retryBlock()">Refazer Bloco</button>
    <button class="btn btn-secondary" onclick="navigate('#/blocks')">Voltar aos Blocos</button>
  </div>

  <!-- SCREEN: DASHBOARD -->
  <div class="screen" id="screenDashboard">
    <h2 class="dashboard-title">Seu Progresso</h2>
    <div class="dashboard-blocks" id="dashBlocks"></div>
    <div class="weak-topics" id="dashWeakTopics" style="display:none">
      <div class="weak-topics-title">Topicos para Revisar (Geral)</div>
      <div id="dashWeakList"></div>
    </div>
    <button class="btn btn-secondary" onclick="navigate('#/')">Voltar ao Inicio</button>
    <button class="btn btn-danger" onclick="confirmReset()">Resetar Progresso</button>
  </div>
</div>

<script>
// ====== QUESTION DATA ======
const QUESTIONS = [
  // BLOCK 1: LINGUA PORTUGUESA
  {
    id:"pt-01", block:1, blockName:"Lingua Portuguesa", topic:"Regencia Verbal",
    question:"Assinale a alternativa que contem ERRO de regencia verbal:",
    options:[
      {key:"A", text:"Assistimos ao jogo do Brasil com entusiasmo."},
      {key:"B", text:"O diretor aspirava ao cargo de presidente."},
      {key:"C", text:"Prefiro estudar do que trabalhar."},
      {key:"D", text:"Todos obedeceram ao regulamento interno."}
    ],
    correct:"C",
    explanation:"O verbo 'preferir' exige a preposicao 'a', nunca 'do que'. A forma correta e: 'Prefiro estudar A trabalhar'. Esse e um dos erros mais cobrados em concursos.",
    studySuggestion:"Revise Regencia Verbal, especialmente os verbos: preferir (a, nao 'do que'), assistir (a), visar (a), obedecer (a), namorar (sem preposicao)."
  },
  {
    id:"pt-02", block:1, blockName:"Lingua Portuguesa", topic:"Figuras de Linguagem",
    question:"Na frase 'O sol sorriu para nos naquela manha', a figura de linguagem presente e:",
    options:[
      {key:"A", text:"Metafora"},
      {key:"B", text:"Metonimia"},
      {key:"C", text:"Prosopopeia (Personificacao)"},
      {key:"D", text:"Hiperbole"}
    ],
    correct:"C",
    explanation:"Prosopopeia (ou personificacao) e a figura de linguagem que atribui caracteristicas humanas a seres inanimados ou irracionais. 'Sorrir' e uma acao humana atribuida ao sol.",

// ====== STATE MANAGEMENT ======
const STORAGE_KEY = 'dandara_quiz_v1';

function loadProgress() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) return JSON.parse(data);
  } catch(e) {}
  return { version:1, blocks:{}, totalCorrect:0, totalAnswered:0 };
}

function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

let progress = loadProgress();
let currentBlock = null;
let currentIndex = 0;
let isAnswered = false;

// ====== ROUTER ======
function navigate(hash) {
  window.location.hash = hash;
}

function goBack() {
  const hash = window.location.hash;
  if (hash.startsWith('#/quiz/') || hash.startsWith('#/results/')) {
    navigate('#/blocks');
  } else if (hash === '#/blocks' || hash === '#/dashboard') {
    navigate('#/');
  } else {
    navigate('#/');
  }
}

function handleRoute() {
  const hash = window.location.hash || '#/';
  const screens = document.querySelectorAll('.screen');
  screens.forEach(s => s.classList.remove('active'));

  const navBack = document.getElementById('navBack');
  const navTitle = document.getElementById('navTitle');
  const navProgress = document.getElementById('navProgress');

  if (hash === '#/' || hash === '') {
    document.getElementById('screenLanding').classList.add('active');
    navBack.style.display = 'none';
    navTitle.textContent = 'Quiz Escriturario';
    navProgress.textContent = '';
    renderLanding();
  } else if (hash === '#/blocks') {
    document.getElementById('screenBlocks').classList.add('active');
    navBack.style.display = 'inline-block';
    navTitle.textContent = 'Escolha um Bloco';
    navProgress.textContent = '';
    renderBlocks();
  } else if (hash.startsWith('#/quiz/')) {
    const blockId = parseInt(hash.split('/')[2]);
    document.getElementById('screenQuiz').classList.add('active');
    navBack.style.display = 'inline-block';
    navTitle.textContent = getBlockName(blockId);
    startQuiz(blockId);
  } else if (hash.startsWith('#/results/')) {
    const blockId = parseInt(hash.split('/')[2]);
    document.getElementById('screenResults').classList.add('active');
    navBack.style.display = 'inline-block';
    navTitle.textContent = 'Resultado';
    navProgress.textContent = '';
    renderResults(blockId);
  } else if (hash === '#/dashboard') {
    document.getElementById('screenDashboard').classList.add('active');
    navBack.style.display = 'inline-block';
    navTitle.textContent = 'Dashboard';
    navProgress.textContent = '';
    renderDashboard();
  }
}

// ====== HELPERS ======
function getBlockName(id) {
  const names = {1:'Lingua Portuguesa',2:'Matematica',3:'Conhecimentos Gerais',4:'Informatica',5:'Conhecimentos Especificos'};
  return names[id] || '';
}

function getBlockIcon(id) {
  const icons = {1:'\u{1F4DA}',2:'\u{1F522}',3:'\u{1F30E}',4:'\u{1F4BB}',5:'\u{1F3DB}'};
  return icons[id] || '';
}

function getBlockQuestions(blockId) {
  return QUESTIONS.filter(q => q.block === blockId);
}

function getBlockProgress(blockId) {
  const blockData = progress.blocks[blockId];
  if (!blockData || !blockData.answers) return { answered:0, correct:0, total:10 };
  const answers = Object.values(blockData.answers);
  return {
    answered: answers.length,
    correct: answers.filter(a => a.correct).length,
    total: 10
  };
}

// ====== RENDERERS ======
function renderLanding() {
  progress = loadProgress();
  const totalAnswered = progress.totalAnswered || 0;
  const totalCorrect = progress.totalCorrect || 0;
  const pct = totalAnswered > 0 ? Math.round((totalAnswered / 50) * 100) : 0;
  const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) + '%' : '--';

  document.getElementById('landingPct').textContent = pct + '%';
  document.getElementById('statAnswered').textContent = totalAnswered;
  document.getElementById('statCorrect').textContent = totalCorrect;
  document.getElementById('statAccuracy').textContent = accuracy;

  const circumference = 2 * Math.PI * 65;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('progressRing').style.strokeDashoffset = offset;
}

function renderBlocks() {
  progress = loadProgress();
  const grid = document.getElementById('blocksGrid');
  let html = '';

  for (let i = 1; i <= 5; i++) {
    const bp = getBlockProgress(i);
    const status = bp.answered === 10 ? 'completed' : bp.answered > 0 ? 'in-progress' : '';
    const meta = bp.answered === 10
      ? `${bp.correct}/10 acertos`
      : bp.answered > 0
        ? `${bp.answered}/10 respondidas`
        : '10 questoes';
    const pctWidth = (bp.answered / 10) * 100;

    html += `
      <div class="block-card ${status}" onclick="navigate('#/quiz/${i}')">
        <div class="block-icon">${getBlockIcon(i)}</div>
        <div class="block-info">
          <div class="block-name">${getBlockName(i)}</div>
          <div class="block-meta">${meta}</div>
          <div class="block-progress-bar"><div class="block-progress-fill" style="width:${pctWidth}%"></div></div>
        </div>
      </div>`;
  }
  grid.innerHTML = html;
}

function startQuiz(blockId) {
  progress = loadProgress();
  currentBlock = blockId;
  isAnswered = false;

  const blockData = progress.blocks[blockId];
  if (blockData && blockData.answers) {
    currentIndex = Object.keys(blockData.answers).length;
    if (currentIndex >= 10) currentIndex = 0;
  } else {
    currentIndex = 0;
  }

  renderQuestion();
}

function renderQuestion() {
  const questions = getBlockQuestions(currentBlock);
  const q = questions[currentIndex];
  isAnswered = false;

  document.getElementById('navProgress').textContent = `${currentIndex + 1}/10`;

  // Dots
  let dotsHtml = '';
  const blockData = progress.blocks[currentBlock];
  for (let i = 0; i < 10; i++) {
    let cls = 'quiz-dot';
    if (i === currentIndex) cls += ' current';
    else if (blockData && blockData.answers) {
      const qId = questions[i].id;
      if (blockData.answers[qId]) {
        cls += blockData.answers[qId].correct ? ' correct' : ' wrong';
      }
    }
    dotsHtml += `<div class="${cls}"></div>`;
  }
  document.getElementById('quizDots').innerHTML = dotsHtml;
  document.getElementById('quizCounter').textContent = `Questao ${currentIndex + 1} de 10`;
  document.getElementById('quizTopic').textContent = q.topic;
  document.getElementById('quizQuestion').textContent = q.question;

  // Options
  let optHtml = '';
  for (const opt of q.options) {
    optHtml += `
      <button class="option-btn" data-key="${opt.key}" onclick="selectAnswer('${opt.key}')">
        <span class="option-key">${opt.key}</span>
        <span class="option-text">${opt.text}</span>
      </button>`;
  }
  document.getElementById('quizOptions').innerHTML = optHtml;

  // Hide explanation and next
  document.getElementById('explanationPanel').classList.remove('visible');
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('studySuggestion').style.display = 'none';
}

function selectAnswer(key) {
  if (isAnswered) return;
  isAnswered = true;

  const questions = getBlockQuestions(currentBlock);
  const q = questions[currentIndex];
  const isCorrect = key === q.correct;

  // Update progress
  if (!progress.blocks[currentBlock]) {
    progress.blocks[currentBlock] = { answers: {}, completed: false };
  }
  progress.blocks[currentBlock].answers[q.id] = { selected: key, correct: isCorrect };

  // Recalculate totals
  let totalA = 0, totalC = 0;
  for (const b of Object.values(progress.blocks)) {
    if (b.answers) {
      const ans = Object.values(b.answers);
      totalA += ans.length;
      totalC += ans.filter(a => a.correct).length;
    }
  }
  progress.totalAnswered = totalA;
  progress.totalCorrect = totalC;

  // Check block complete
  if (Object.keys(progress.blocks[currentBlock].answers).length >= 10) {
    progress.blocks[currentBlock].completed = true;
  }

  saveProgress(progress);

  // Visual feedback
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(btn => {
    btn.classList.add('disabled');
    const btnKey = btn.dataset.key;
    if (btnKey === key && isCorrect) {
      btn.classList.add('selected-correct');
    } else if (btnKey === key && !isCorrect) {
      btn.classList.add('selected-wrong');
    }
    if (btnKey === q.correct && !isCorrect) {
      btn.classList.add('reveal-correct');
    }
  });

  // Show explanation
  document.getElementById('explanationText').textContent = q.explanation;
  document.getElementById('explanationPanel').classList.add('visible');

  if (!isCorrect) {
    document.getElementById('studySuggestion').style.display = 'block';
    document.getElementById('studySuggestionText').textContent = q.studySuggestion;
  } else {
    document.getElementById('studySuggestion').style.display = 'none';
  }

  // Show next button
  const btnNext = document.getElementById('btnNext');
  if (currentIndex < 9) {
    btnNext.textContent = 'Proxima Questao';
  } else {
    btnNext.textContent = 'Ver Resultado';
  }
  btnNext.style.display = 'block';

  // Update dot
  const dots = document.querySelectorAll('.quiz-dot');
  dots[currentIndex].classList.remove('current');
  dots[currentIndex].classList.add(isCorrect ? 'correct' : 'wrong');
}

function nextQuestion() {
  if (currentIndex < 9) {
    currentIndex++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    navigate(`#/results/${currentBlock}`);
  }
}

function renderResults(blockId) {
  progress = loadProgress();
  const questions = getBlockQuestions(blockId);
  const blockData = progress.blocks[blockId];

  if (!blockData || !blockData.answers) {
    navigate('#/blocks');
    return;
  }

  const answers = blockData.answers;
  const correct = Object.values(answers).filter(a => a.correct).length;
  const total = Object.keys(answers).length;
  const pct = Math.round((correct / total) * 100);

  // Score circle
  const circumference = 2 * Math.PI * 56;
  const offset = circumference - (pct / 100) * circumference;
  const circle = document.getElementById('resultsCircle');
  circle.style.strokeDashoffset = offset;
  circle.style.stroke = pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--amber)' : 'var(--wrong)';

  document.getElementById('resultsNumber').textContent = `${correct}/${total}`;

  const messages = {
    high: 'Excelente! Voce mandou bem!',
    mid: 'Bom trabalho! Continue estudando!',
    low: 'Nao desista! Revise os topicos abaixo.'
  };
  const msgEl = document.getElementById('resultsMessage');
  msgEl.textContent = pct >= 70 ? messages.high : pct >= 40 ? messages.mid : messages.low;
  msgEl.style.color = pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--amber)' : 'var(--wrong)';

  // Results list
  let listHtml = '';
  const weakTopics = [];
  for (const q of questions) {
    const ans = answers[q.id];
    if (ans) {
      const icon = ans.correct ? '<div class="result-icon correct">&#10003;</div>' : '<div class="result-icon wrong">&#10007;</div>';
      listHtml += `<div class="result-item">${icon}<span class="result-topic">${q.topic}</span></div>`;
      if (!ans.correct) weakTopics.push(q);
    }
  }
  document.getElementById('resultsList').innerHTML = listHtml;

  // Weak topics
  const weakDiv = document.getElementById('weakTopics');
  if (weakTopics.length > 0) {
    weakDiv.style.display = 'block';
    let weakHtml = '';
    for (const q of weakTopics) {
      weakHtml += `<div class="weak-topic-item"><strong>${q.topic}:</strong> ${q.studySuggestion}</div>`;
    }
    document.getElementById('weakTopicsList').innerHTML = weakHtml;
  } else {
    weakDiv.style.display = 'none';
  }

  // Store current block for retry
  currentBlock = blockId;
}

function retryBlock() {
  if (currentBlock && progress.blocks[currentBlock]) {
    const oldAnswers = progress.blocks[currentBlock].answers || {};
    const oldCorrect = Object.values(oldAnswers).filter(a => a.correct).length;
    const oldTotal = Object.keys(oldAnswers).length;

    progress.totalAnswered -= oldTotal;
    progress.totalCorrect -= oldCorrect;
    progress.blocks[currentBlock] = { answers: {}, completed: false };
    saveProgress(progress);
  }
  currentIndex = 0;
  navigate(`#/quiz/${currentBlock}`);
}

function renderDashboard() {
  progress = loadProgress();
  let html = '';

  for (let i = 1; i <= 5; i++) {
    const bp = getBlockProgress(i);
    let scoreText = '--';
    let scoreColor = 'var(--text-muted)';
    if (bp.answered > 0) {
      const pct = Math.round((bp.correct / bp.answered) * 100);
      scoreText = `${bp.correct}/${bp.answered} (${pct}%)`;
      scoreColor = pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--amber)' : 'var(--wrong)';
    }
    html += `
      <div class="dash-block">
        <span style="font-size:20px">${getBlockIcon(i)}</span>
        <span class="dash-block-name">${getBlockName(i)}</span>
        <span class="dash-block-score" style="color:${scoreColor}">${scoreText}</span>
      </div>`;
  }
  document.getElementById('dashBlocks').innerHTML = html;

  // All weak topics
  const allWeak = [];
  for (const [blockId, blockData] of Object.entries(progress.blocks)) {
    if (!blockData.answers) continue;
    const questions = getBlockQuestions(parseInt(blockId));
    for (const q of questions) {
      const ans = blockData.answers[q.id];
      if (ans && !ans.correct) {
        allWeak.push(q);
      }
    }
  }

  const dashWeak = document.getElementById('dashWeakTopics');
  if (allWeak.length > 0) {
    dashWeak.style.display = 'block';
    let weakHtml = '';
    const seen = new Set();
    for (const q of allWeak) {
      if (!seen.has(q.topic)) {
        seen.add(q.topic);
        weakHtml += `<div class="weak-topic-item"><strong>${q.topic}</strong> (${q.blockName})</div>`;
      }
    }
    document.getElementById('dashWeakList').innerHTML = weakHtml;
  } else {
    dashWeak.style.display = 'none';
  }
}

function confirmReset() {
  const btn = event.target;
  if (btn.dataset.confirm === 'true') {
    localStorage.removeItem(STORAGE_KEY);
    progress = loadProgress();
    btn.textContent = 'Resetar Progresso';
    btn.dataset.confirm = '';
    navigate('#/');
  } else {
    btn.textContent = 'Confirmar Reset? (clique de novo)';
    btn.dataset.confirm = 'true';
    setTimeout(() => {
      btn.textContent = 'Resetar Progresso';
      btn.dataset.confirm = '';
    }, 3000);
  }
}

// ====== INIT ======
window.addEventListener('hashchange', handleRoute);
handleRoute();
</script>
